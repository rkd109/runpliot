services:
  postgres:
    image: postgres:16
    container_name: runpilot-postgres
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: runpilot
      POSTGRES_USER: runpilot
      POSTGRES_PASSWORD: runpilot1234
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runpilot -d runpilot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - runpilot-postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: runpilot-api
    restart: unless-stopped
    env_file:
      - ../../apps/api/.env.local
    environment:
      DATABASE_URL: postgresql://runpilot:runpilot1234@host.docker.internal:15432/runpilot
      PORT: 3001
      FRONT_BASE_URL: http://localhost:3000
      CHOKIDAR_USEPOLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"
    volumes:
      - ../../apps/api/src:/workspace/apps/api/src
      - ../../apps/api/prisma:/workspace/apps/api/prisma
      - ../../packages/shared/src:/workspace/packages/shared/src
    command: >
      sh -c "
        pnpm --filter @runpilot/shared build &&
        pnpm --filter @runpilot/api prisma:generate &&
        pnpm --filter @runpilot/api db:migrate:deploy &&
        pnpm --filter @runpilot/api start:dev
      "

volumes:
  runpilot-postgres-data:
